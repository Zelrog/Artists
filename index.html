<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Artists</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <h1 class="title-font">My Artist Stash</h1>
        <p class="body-font">Filter artists by platform:</p>
        
        <!-- Sorting Buttons -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-platform="all">All</button>
            <button class="filter-btn" data-platform="fa" title="FurAffinity"><i class="fa-solid fa-paw"></i></button>
            <button class="filter-btn" data-platform="e621" title="e621"><span class="e621-icon">e6</span></button>
            <button class="filter-btn" data-platform="bluesky" title="Bluesky">
                <svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor"><path d="M111.8 62.2C170.2 105.9 233.3 194.7 256 242.4c22.7-47.7 85.8-136.5 144.2-180.2c41.6-31.6 108.3-48.2 111.8-6.1c.1 1.6 0 3.3 0 5c-5.1 82.6-23.7 190.5-28.7 212.1c-11.8 51.1-55.8 64.1-99.7 55.9c-32.6-6-77-23.3-106.9-37.1c89.4 59.8 82.5 138.2 13.3 172.7c-59.8 29.8-103.4-16-116.7-41.6c-10.4-20-16.6-58.1-16.6-58.1s-6.2 38.1-16.6 58.1c-13.3 25.6-56.9 71.4-116.7 41.6c-69.2-34.5-76.1-112.9 13.3-172.7c-29.9 13.8-74.3 31.1-106.9 37.1c-43.9 8.2-87.9-4.8-99.7-55.9c-5-21.6-23.6-129.5-28.7-212.1c0-1.7-.1-3.4 0-5c3.5-42.1 70.2-25.5 111.8 6.1z"/></svg>
            </button>
            <button class="filter-btn" data-platform="twitter" title="Twitter/X"><i class="fa-brands fa-x-twitter"></i></button>
            <button class="filter-btn" data-platform="pixiv" title="Pixiv"><i class="fa-solid fa-palette"></i></button>
        </div>
    </header>

    <main>
        <!-- Artist Grid -->
        <div class="artist-grid" id="artistGrid"></div>
    </main>

    <!-- Sliding Side Panel -->
    <div id="sidePanel" class="side-panel">
        <button id="closePanel" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        <div class="panel-content" id="panelContent">
            <!-- Content injected by JavaScript -->
        </div>
    </div>
    
    <!-- Overlay for when panel is open -->
    <div id="panelOverlay" class="panel-overlay"></div>

    <script src="script.js"></script>
</body>
</html>
