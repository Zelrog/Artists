<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Artists</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <h1 class="title-font">My Artist Stash</h1>
        <p class="body-font">Filter artists by platform:</p>
        
        <!-- Sorting Buttons -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-platform="all">ALL</button>
            <button class="filter-btn" data-platform="fa" title="FurAffinity"><span class="icon-fa"></span></button>
            <button class="filter-btn" data-platform="e621" title="e621"><span class="icon-e621"></span></button>
            <button class="filter-btn" data-platform="bluesky" title="Bluesky"><span class="icon-bluesky"></span></button>
            <button class="filter-btn" data-platform="twitter" title="Twitter"><i class="fa-brands fa-twitter"></i></button>
            <button class="filter-btn" data-platform="pixiv" title="Pixiv"><span class="icon-pixiv"></span></button>
        </div>
    </header>

    <main>
        <!-- Artist Grid -->
        <div class="artist-grid" id="artistGrid"></div>
    </main>

    <!-- Sliding Side Panel -->
    <div id="sidePanel" class="side-panel">
        <button id="closePanel" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        <div class="panel-content" id="panelContent">
            <!-- Content injected by JavaScript -->
        </div>
    </div>
    
    <!-- Overlay for when panel is open -->
    <div id="panelOverlay" class="panel-overlay"></div>

    <script src="script.js"></script>
</body>
</html>
