<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Artists</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <h1 class="title-font">My Artist Stash</h1>
        <p class="body-font">Filter artists by platform:</p>
        
        <!-- Sorting Buttons -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-platform="all">ALL</button>

            </button>
            <button class="filter-btn" data-platform="e621" title="e621">
                <svg viewBox="0 0 24 24">
                    <defs>
                        <mask id="e6-mask-btn">
                            <rect width="24" height="24" fill="white" />
                            <text x="12" y="14.6" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="6.8" text-anchor="middle" letter-spacing="-0.5" fill="black">e621</text>
                        </mask>
                    </defs>
                    <path d="M12 1L21.5 6.5v11L12 23 2.5 17.5v-11L12 1z" fill="currentColor" mask="url(#e6-mask-btn)" />
                </svg>
            </button>
            <button class="filter-btn" data-platform="bluesky" title="Bluesky">
                <svg viewBox="0 0 24 24"><path d="M12 10.8c-1.087-2.114-4.046-6.053-6.798-7.995C2.566.944 1.561 1.266.902 1.565.139 1.908 0 3.08 0 3.768c0 .69.378 5.65.624 6.479.815 2.736 3.713 3.66 6.383 3.364.136-.02.275-.039.415-.056-.138.022-.276.04-.415.056-3.912.58-7.387 2.005-2.83 7.078 5.013 5.19 6.87-1.113 7.823-4.381.953 3.268 2.81 9.57 7.823 4.381 4.557-5.073 1.082-6.498-2.83-7.078-.139-.016-.277-.034-.415-.056.14.017.279.036.415.056 2.67.297 5.568-.628 6.383-3.364.246-.828.624-5.79.624-6.478 0-.69-.139-1.861-.902-2.204-.659-.298-1.664-.62-4.3 1.24C16.046 4.748 13.087 8.687 12 10.8Z"/></svg>
            </button>
            <button class="filter-btn" data-platform="twitter" title="Twitter">
                <svg viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z"/></svg>
            </button>
            <button class="filter-btn" data-platform="pixiv" title="Pixiv">
                <svg viewBox="0 0 24 24"><path d="M7.483 0C3.35 0 0 3.35 0 7.483v9.034C0 20.65 3.35 24 7.483 24h9.034C20.65 24 24 20.65 24 16.517V7.483C24 3.35 20.65 0 16.517 0zm6.91 3.52c2.81 0 5.166 1.83 5.926 4.385.76 2.556.096 5.418-1.745 7.26a7.28 7.28 0 0 1-7.26 1.746 7.284 7.284 0 0 1-4.384-5.926c-.76-2.556-.096-5.418 1.745-7.26a7.284 7.284 0 0 1 5.718-2.205zm-3.23 11.238a4.896 4.896 0 0 0 4.39-.77 4.9 4.9 0 0 0 1.776-3.87 4.896 4.896 0 0 0-1.776-3.87 4.9 4.9 0 0 0-4.39-.77v9.28z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <!-- Artist Grid -->
        <div class="artist-grid" id="artistGrid"></div>
    </main>

    <!-- Sliding Side Panel -->
    <div id="sidePanel" class="side-panel">
        <button id="closePanel" class="close-btn" aria-label="Close panel"><i class="fa-solid fa-xmark"></i></button>
        <div class="panel-content" id="panelContent">
            <!-- Dynamic Content -->
        </div>
    </div>
    
    <div id="panelOverlay" class="panel-overlay"></div>

    <script src="artists.js"></script>
    <script src="script.js"></script>
</body>
</html>
